[tool.poetry]
name = "uo"
version = "0.3.0"
description = "Universal Optimizer Library"
authors = ["Vladimir Filipovic <vladofilipovic@hotmail.com>"]
license = "Apache 2.0"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
pathlib = "^1.0.1"
bitstring = "^4.1.1"
coverage = "^7.4.0"
networkx = "^3.3"
rdkit = "^2024.3.2"
highspy = "^1.12.0"
numpy = "^2.0"
scipy = "^1.11"

[tool.poetry.group.docs] 
optional = true

[tool.poetry.group.docs.dependencies]
sphinx = "^7.2.5"
sphinx-copybutton = "^0.5.2"
sphinx-rtd-theme = "^1.3.0"


[tool.poetry.group.dev.dependencies]
pylint = "^3.3.7"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
